name: bop-sap

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ── Python ──────────────────────────────────────────────────────────────────
  - python=3.10

  # ── NVIDIA PyTorch with CUDA 11.8 ───────────────────────────────────────────
  # Change pytorch-cuda=11.8 to 12.1 or 12.4 if your driver supports it
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=11.8

  # ── Core scientific stack ─────────────────────────────────────────────────
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.4.0
  - matplotlib>=3.8.0
  - tqdm>=4.66.0
  - numba>=0.57.0          # required by umap-learn

  # ── pip-only packages (no conda build available) ──────────────────────────
  - pip
  - pip:
    - openai>=1.0.0
    - cohere>=4.2.1
    - transformers>=4.43.0
    - accelerate>=0.30.0
    - tokenizers>=0.19.0
    - huggingface-hub>=0.23.0
    - sentencepiece>=0.1.99
    - protobuf>=3.20.0
    - safetensors>=0.4.0
    - bitsandbytes>=0.41.0
    - optuna>=3.5.0
    - openpyxl>=3.1.2
    - umap-learn>=0.5.6
    - pynndescent>=0.5.11

# ==============================================================================
# Usage:
#   conda env create -f environment.yml
#   conda activate bop-sap
#
# Update existing env:
#   conda env update -f environment.yml --prune
#
# Remove env:
#   conda env remove -n bop-sap
# ==============================================================================
